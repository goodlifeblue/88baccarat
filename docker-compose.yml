name: 88baccarat
services:
  directus:
    image: directus/directus:11.17.3
    ports:
      - '127.0.0.1:8088:8055'
    environment:
      SECRET: ${DIRECTUS_SECRET:?Set DIRECTUS_SECRET in .env}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:?Set DIRECTUS_ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:?Set DIRECTUS_ADMIN_PASSWORD in .env}
      DB_CLIENT: sqlite3
      DB_FILENAME: /directus/database/data.db
      PUBLIC_URL: ${DIRECTUS_URL:-http://localhost:8088}
      REFRESH_TOKEN_COOKIE_NAME: baccarat88_refresh_token
      SESSION_COOKIE_NAME: baccarat88_session_token
    volumes:
      - ./directus/database:/directus/database
      - ./directus/uploads:/directus/uploads
      - ./directus/extensions:/directus/extensions
      - ./directus/hooks/redirects:/directus/extensions/directus-extension-article-redirects:ro
